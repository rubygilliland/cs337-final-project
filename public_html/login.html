<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="header">
    <h1>U of A Hoodies Store</h1>
  </div>
  <div id="block">
    <form id="loginForm">
      <div class="input_row">
            <label for="username">Username:</label>
            <input id="username" required>
      </div>
      <div class="input_row">
        <label for="password">Password:</label>
        <input id="password" type="password" required>
      </div>
      <br><br>
      <button type="submit">Login</button>
    </form>
    <br><br><br>
    <a href="/register" id="createAccount">Create an Account</a>
    <p id="message"></p>
  </div>
  <footer>
    <nav>
      <a href="/home">Home</a> <span>|</span>
      <a href="/products">Products</a> <span>|</span>
      <a href="/cart">Cart</a>
    </nav>
  </footer>
  <script src="account.js"></script>
</body>
</html>
