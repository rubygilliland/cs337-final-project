<!DOCTYPE html>
<html>
<head>
    <title>Cart</title>
    <link rel="stylesheet" href="style.css">
</head>

<body onload="loadCart(); setCartTitle()"> 
    <div id="header">
        <h1>U of A Hoodies Store</h1>
    </div>

    <div id="cart_block">
        <h2 id="cart_title"></h2>

        <div id="cart_items"></div>

        <p id="cart_total_text">
            Total: $<span id="cart_total">0.00</span>
        </p>

        <button onclick="checkout()">Check Out</button>
        <p id="message"></p>
    </div>
    <footer>
        <nav>
            <a href="/home">Home</a> |
            <a href="/login">Account</a> |
            <a href="/products">Products</a>
        </nav>
    </footer>

    <script src="cart_src.js"></script>
</body>
</html>
